apiVersion: apps/v1
kind: Deployment
metadata:
  name: retro-agent
  labels: { app: retro-agent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: retro-agent }
  template:
    metadata:
      labels: { app: retro-agent }
    spec:
      containers:
        - name: retro-agent
          image: retro-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: retro-agent-secrets, key: llm-api-key, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: retro-agent
spec:
  selector: { app: retro-agent }
  ports:
    - { port: 80, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }
