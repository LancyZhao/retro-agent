[project]
name = "retro-agent"
version = "0.1.0"
description = "An AI retrospective & summary assistant: a small, pluggable Agent platform that pulls work data from business systems (OA/Git/Jira-style connectors), grounds it with RAG, and produces structured retrospectives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LancyZhao" }]

# Core engine (agent + RAG + connectors + offline LLM mock) uses only the
# Python standard library, so `pytest` runs with zero third-party installs.
# Serving and real-LLM/Redis integrations are optional extras below.
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
]
redis = ["redis>=5.0,<6.0"]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0", "httpx>=0.27,<1.0"]

[project.scripts]
retro = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.llm", "app.rag", "app.connectors", "app.agent", "app.eval"]
